# A longer fuzz run with a fresh random seed every week, to find what the fixed short run in ci.yml can't.
# The seed is printed in the log and in any saved failure's file name, so a failure can be replayed.
name: Fuzz
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz
        env:
          FUZZ_ITERATIONS: '3000'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: tests/fuzz/failures/
          retention-days: 30
          if-no-files-found: ignore

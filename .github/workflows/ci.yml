# Runs the full test suite and the production build on GitHub's Linux machines
# for every push and pull request. A red cross on a commit means something broke.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits (a tag can be moved; a commit can't). Dependabot
      # proposes updates weekly, see .github/dependabot.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

# Checks the live site against this repository: every file served exactly as built from this source,
# nothing loaded from another site, the headers from public/_headers, and no headers that send reports
# elsewhere. Things added at the hosting edge (an analytics script, reporting headers) never appear in the
# code, so only a check of the live site can catch them. Runs after every push to main (waiting for the
# deploy to finish), every day, and on request from the Actions tab.
name: Live site check
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-live.mjs https://cornerfold.org --wait 900
